ngl = -1
# np = 1
spec-type = draft-mtp
spec-draft-n-max = 3
no-mmproj = on
flash-attn = on
batch-size = 2048
ubatch-size = 512
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0 
reasoning = on
reasoning-budget = -1
chat-template-kwargs = {"preserve_thinking":true}
cache-type-k = q8_0
cache-type-v = q5_1
; cache-type-v = turbo4

[Gemma-4-31B-it-UD-Q4]
model = ./Gemma-4-31B-it-UD-Q4_K_XL.gguf
;model-draft = ./Gemma-4-31B-MTP-draft-it-Q8_0.gguf
; mmproj = ./Gemma-4-mmproj-BF16.gguf
;spec-type = ngram-mod
;spec-draft-n-max = 3
ctx-size = 81920
ctx-checkpoints = 16
; ngl = -1
;fit = on
;fit-target = 2048
flash-attn = on
