[*]
sleep-idle-seconds = 1800
dev = ROCm0
#dev = Vulkan0
jinja = 1

no-mmap = 1
;mlock = 1
mmproj-offload = off
threads = 24
threads-batch = 24
np = 2
kv-unified = 1
cache-reuse = 1
cache-ram = 8192

# log level (uncomment for debug)
#lv = 4

[Qwen3.8-27B-Q4]
model = ./Qwen3.8-27B-Q4_K_M.gguf
# mmproj = ./Qwen3.8-mmproj.gguf
no-mmproj = on
ctx-size = 81920
ctx-checkpoints = 16
ngl = -1
# np = 1
spec-type = draft-mtp
spec-draft-n-max = 3
flash-attn = on
batch-size = 2048
ubatch-size = 512
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0 
reasoning = on
reasoning-budget = -1
chat-template-kwargs = {"preserve_thinking":true,"reasoning_effort":"medium"}
cache-type-k = q8_0
cache-type-v = q5_1
; cache-type-v = turbo4

[Muse-Glimmer-30B-UD-Q5]
model = ./Muse-Glimmer-30B-UD-Q5_K_M.gguf
model-draft = ./Muse-Glimmer-dflash-kquant.gguf
spec-type = draft-dflash
spec-draft-n-max = 3
ctx-size = 102400
ctx-checkpoints = 16
; ngl = -1
; n-cpu-moe = 17
fit = off
flash-attn = on
batch-size = 2048
ubatch-size = 512
no-mmproj = 1
temp = 1.0
top-p = 0.95
top-k = 64
repeat-penalty = 1.05
presence-penalty = 1.5
reasoning = on
reasoning-budget = -1
repeat-penalty = 1.0 
jinja = on
cache-type-k = q8_0
cache-type-v = q5_1
; cache-type-v = turbo4

# Qwen 3.6 35B MoE-based enhanced model
[Ornith-1.0-35B-UD-Q6]
model = ./Ornith-1.0-35B-UD-Q6_K_XL.gguf
ctx-size = 81920
ctx-checkpoints = 16
; ngl = -1
n-cpu-moe = 17
fit = off
flash-attn = on
batch-size = 2048
ubatch-size = 512
no-mmproj = 1
temp = 0.75
top-p = 0.95
top-k = 20
min-p = 0.024
repeat-penalty = 1.05
presence-penalty = 1.5
reasoning = on
reasoning-budget = -1
reasoning-format = deepseek
repeat-penalty = 1.0 
jinja = on
chat-template-file = /etc/llamacpp/templates/qwen_fixed_chat_tpl.jinja
chat-template-kwargs = {"preserve_thinking":true}
cache-type-k = q8_0
cache-type-v = q5_1
; cache-type-v = turbo4

# Qwen3.6-27B-Fable-Fus-711-UnHeretic-NM-DAU-NEO-MAX-NEO-MTP-Q4_K_M
[Qwen3.6-27B-Fab-Fus-Uncen-Q4]
model = ./Qwen3.6-27B-Fable-Fus-711-UnHeretic-NM-DAU-NEO-MAX-NEO-MTP-Q4_K_M.gguf
# mmproj = ./Qwen3.6-mmproj.gguf
ctx-size = 81920
