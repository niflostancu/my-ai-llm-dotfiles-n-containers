# Read the documentation before extending the defaults:
# https://docs.searxng.org/admin/settings/

use_default_settings:
  engines:
    remove:
      - google
      - bing
      - startpage

general:
  instance_name: "SearXNG"
  debug: false
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  # record stats
  enable_metrics: true
  # disable /metrics
  open_metrics: ''

server:
  limiter: false
  image_proxy: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json  # required for MCP

outgoing:
  request_timeout: 3.0
  max_request_timeout: 7.0
  pool_connections: 100
  pool_maxsize: 10
  enable_http2: true

engines:
  - name: duckduckgo
    engine: duckduckgo
    disabled: false
  - name: brave
    engine: brave
    disabled: false
  - name: wikipedia
    engine: wikipedia
    disabled: false
  - name: github
    engine: github
    disabled: false

